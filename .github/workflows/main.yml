name: Run Sanny Compiler
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      script_url:
        description: 'URL to the script file'
        required: true
        type: string
      user_id:
        description: 'Discord user ID'
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Download script file
      run: |
        # Download the script file from the provided URL
        Write-Host "Downloading script from ${{ github.event.inputs.script_url }}"
        Invoke-WebRequest -Uri "${{ github.event.inputs.script_url }}" -OutFile "my.txt"
        Get-Content -Path "my.txt" -TotalCount 5
        
    - name: Set up environment and compile
      run: |
        # Run sanny.exe from the root of the repository to compile my.txt
        Write-Host "Compiling script with sanny.exe"
        & "$env:GITHUB_WORKSPACE\sanny.exe" -c my.txt
        
    - name: Upload compiled file
      uses: actions/upload-artifact@v4
      with:
        name: compiled-output
        path: s.scm
        if-no-files-found: warn
        retention-days: 7
        
    - name: Upload compiled.log file
      uses: actions/upload-artifact@v4
      with:
        name: compilation-logs
        path: compile.log
        if-no-files-found: warn
        retention-days: 7
        
    - name: Delete Previous compile.log
      shell: pwsh
      run: |
        # Use PowerShell command to remove the compile.log file
        if (Test-Path "compile.log") {
          Remove-Item "compile.log"
        }
        
    - name: Notify Discord (if triggered from Discord)
      if: github.event.inputs.user_id != ''
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        USER_ID: ${{ github.event.inputs.user_id }}
      run: |
        # Check if compilation was successful
        $compilationSuccess = Test-Path "s.scm"
        
        # Get artifact URL
        $artifactUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
        
        if ($compilationSuccess) {
          $message = @{
            content = "<@$env:USER_ID> Your script has been compiled successfully! Download the compiled file here: $artifactUrl"
          } | ConvertTo-Json
        } else {
          # Read the error log
          $errorLog = ""
          if (Test-Path "compile.log") {
            $errorLog = Get-Content -Path "compile.log" -Raw
            if ($errorLog.Length -gt 1500) {
              $errorLog = $errorLog.Substring(0, 1500) + "... (truncated)"
            }
          }
          
          $message = @{
            content = "<@$env:USER_ID> There was an error compiling your script. Check the logs for details: $artifactUrl"
            embeds = @(
              @{
                title = "Compilation Error"
                description = "```$errorLog```"
                color = 16711680  # Red color
              }
            )
          } | ConvertTo-Json -Depth 4
        }
        
        # Send message to Discord
        Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $message -ContentType 'application/json'
        
        # Log completion
        Write-Host "Compilation complete for Discord user ID: ${{ github.event.inputs.user_id }}"
