name: Run Sanny Compiler
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      script_url:
        description: 'URL to the script file'
        required: true
        type: string
      user_id:
        description: 'Discord user ID'
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Download script file
      run: |
        # Download the script file from the provided URL
        Write-Host "Downloading script from ${{ github.event.inputs.script_url }}"
        Invoke-WebRequest -Uri "${{ github.event.inputs.script_url }}" -OutFile "my.txt"
        Get-Content -Path "my.txt" -TotalCount 5
        
    - name: Set up environment and compile
      run: |
        # Run sanny.exe from the root of the repository to compile my.txt
        Write-Host "Compiling script with sanny.exe"
        & "$env:GITHUB_WORKSPACE\sanny.exe" -c my.txt
        
    - name: Upload compiled file
      uses: actions/upload-artifact@v4
      with:
        name: compiled-output
        path: s.scm
        if-no-files-found: warn
        retention-days: 7
        
    - name: Upload compiled.log file
      uses: actions/upload-artifact@v4
      with:
        name: compilation-logs
        path: compile.log
        if-no-files-found: warn
        retention-days: 7
        
    - name: Delete Previous compile.log
      shell: pwsh
      run: |
        # Use PowerShell command to remove the compile.log file
        if (Test-Path "compile.log") {
          Remove-Item "compile.log"
        }
        
    - name: Send Discord notification
      if: github.event.inputs.user_id != ''
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        title: "Compilation Result"
        description: "Your script has been processed"
        color: 0x00ff00
        username: Sanny Compiler Bot
        avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
        content: "<@${{ github.event.inputs.user_id }}> Your compilation is complete! Check the artifacts for results."
        
    - name: Log completion
      run: echo "Compilation complete for Discord user ID ${{ github.event.inputs.user_id }}"
