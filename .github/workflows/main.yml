name: Run Sanny Compiler
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      script_url:
        description: 'URL to the script file'
        required: true
        type: string
      user_id:
        description: 'Discord user ID'
        required: true
        type: string

jobs:
  compile:
    runs-on: windows-latest

    env:
      Args: ${{ secrets.Arguments}}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Download script file
      if: github.event_name == 'workflow_dispatch'
      run: |
        # Download the script file from the provided URL
        Invoke-WebRequest -Uri ${{ github.event.inputs.script_url }} -OutFile "my.txt"
        
    - name: Set up environment and compile
      run: |
        # Run sanny.exe from the root of the repository to compile my.txt
        & "$env:GITHUB_WORKSPACE\sanny.exe" -c s.txt
        
    - name: Upload compiled file
      uses: actions/upload-artifact@v4
      with:
        name: compiled-output
        path: my.scm
        if-no-files-found: warn
        retention-days: 7
    - name: Upload compiled.log file
      uses: actions/upload-artifact@v4
      with:
        name: compilation-logs
        path: compile.log
        if-no-files-found: warn
        retention-days: 7
    - name: Delete Previous compile.log
      shell: pwsh
      run: |
        # Use PowerShell command to remove the compile.log file
        if (Test-Path "compile.log") {
          Remove-Item "compile.log"
        }
        
    - name: Notify Discord (if triggered from Discord)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.user_id != ''
      run: |
        # Here you would add code to notify the Discord user that the compilation is complete
        # This is a placeholder - you'll need to implement the actual Discord notification
        Write-Host "Compilation complete for Discord user ID: ${{ github.event.inputs.user_id }}"
